<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MoodBot — License Admin</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0f172a;
    --surface: #1e293b;
    --border:  #334155;
    --text:    #f1f5f9;
    --muted:   #94a3b8;
    --accent:  #a855f7;
    --accent2: #ec4899;
    --green:   #22c55e;
    --yellow:  #eab308;
    --red:     #ef4444;
    --blue:    #3b82f6;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Login screen ─────────────────────────────────────────────── */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    flex-direction: column;
    gap: 12px;
  }
  #login-screen h1 { font-size: 22px; font-weight: 800; }
  #login-screen p  { color: var(--muted); font-size: 13px; }
  #login-secret {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    width: 280px;
    outline: none;
  }
  #login-secret:focus { border-color: var(--accent); }

  /* ── Layout ───────────────────────────────────────────────────── */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  #app.visible { display: flex; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(168,85,247,0.15);
    border: 1px solid rgba(168,85,247,0.3);
    color: #c084fc;
    font-weight: 600;
    -webkit-text-fill-color: #c084fc;
  }

  main { flex: 1; padding: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }

  /* ── Stats bar ────────────────────────────────────────────────── */
  #stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
  }
  .stat-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .stat-card .value { font-size: 28px; font-weight: 800; margin-top: 4px; }

  /* ── Toolbar ──────────────────────────────────────────────────── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  #search-input {
    flex: 1;
    min-width: 180px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  #search-input:focus { border-color: var(--accent); }

  /* ── Buttons ──────────────────────────────────────────────────── */
  .btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: opacity .15s;
    white-space: nowrap;
  }
  .btn:hover { opacity: .85; }
  .btn:active { opacity: .7; }
  .btn-primary  { background: var(--accent); color: #fff; }
  .btn-danger   { background: var(--red);    color: #fff; }
  .btn-warning  { background: var(--yellow); color: #000; }
  .btn-muted    { background: var(--border); color: var(--text); }
  .btn-success  { background: var(--green);  color: #000; }
  .btn-blue     { background: var(--blue);   color: #fff; }
  .btn-sm { padding: 4px 8px; font-size: 12px; border-radius: 6px; }

  /* ── Table ────────────────────────────────────────────────────── */
  #keys-table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    padding: 10px 16px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    background: rgba(0,0,0,.3);
    border-bottom: 1px solid var(--border);
    font-weight: 700;
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(51,65,85,.5);
    font-size: 13px;
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.02); }

  .key-cell {
    font-family: "Courier New", monospace;
    font-size: 12px;
    letter-spacing: .05em;
    color: #e2e8f0;
    cursor: pointer;
    user-select: all;
  }
  .key-cell:hover { color: var(--accent); }

  /* ── Status badges ────────────────────────────────────────────── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .badge-active  { background: rgba(34,197,94,.15);  border: 1px solid rgba(34,197,94,.3);  color: #4ade80; }
  .badge-paused  { background: rgba(234,179,8,.15);  border: 1px solid rgba(234,179,8,.3);  color: #facc15; }
  .badge-revoked { background: rgba(239,68,68,.15);  border: 1px solid rgba(239,68,68,.3);  color: #f87171; }
  .badge-expired { background: rgba(148,163,184,.15);border: 1px solid rgba(148,163,184,.3);color: #94a3b8; }

  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .dot-active  { background: var(--green);  box-shadow: 0 0 6px var(--green); }
  .dot-paused  { background: var(--yellow); }
  .dot-revoked { background: var(--red); }
  .dot-expired { background: var(--muted); }

  .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── Modal ────────────────────────────────────────────────────── */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 420px;
    max-width: 95vw;
  }
  .modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .field input, .field textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ── Toast ────────────────────────────────────────────────────── */
  #toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    animation: slideIn .2s ease;
    max-width: 320px;
  }
  .toast-ok    { border-color: rgba(34,197,94,.4);  color: #4ade80; }
  .toast-err   { border-color: rgba(239,68,68,.4);  color: #f87171; }
  .toast-info  { border-color: rgba(168,85,247,.4); color: #c084fc; }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* ── Empty state ──────────────────────────────────────────────── */
  .empty { text-align: center; padding: 48px; color: var(--muted); }
  .empty h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); }

  /* ── Hwid cell ────────────────────────────────────────────────── */
  .hwid-cell {
    font-family: "Courier New", monospace;
    font-size: 11px;
    color: var(--muted);
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Log modal ────────────────────────────────────────────────── */
  .log-entry { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .log-entry:last-child { border-bottom: none; }
  .log-action { font-weight: 700; color: #c084fc; }
  .log-time   { color: var(--muted); font-size: 11px; }
  .log-detail { color: var(--muted); font-size: 11px; }
  #log-list { max-height: 320px; overflow-y: auto; }
</style>
</head>
<body>

<!-- ── Login Screen ─────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div style="font-size:32px">🔑</div>
  <h1>MoodBot Admin</h1>
  <p>Enter your admin secret to continue</p>
  <input id="login-secret" type="password" placeholder="Admin secret..." autocomplete="off" />
  <button class="btn btn-primary" id="login-btn" style="width:280px;justify-content:center;">Unlock Dashboard</button>
  <p id="login-error" style="color:var(--red);font-size:12px;min-height:16px;"></p>
</div>

<!-- ── Main App ──────────────────────────────────────────────────────────────── -->
<div id="app">
  <header>
    <div class="brand">
      <span>MoodBot</span>
      <span class="tag">License Admin</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="server-url-display" style="font-size:12px;color:var(--muted);"></span>
      <button class="btn btn-muted btn-sm" id="logout-btn">Logout</button>
    </div>
  </header>

  <main>
    <!-- Stats -->
    <div id="stats-bar">
      <div class="stat-card">
        <div class="label">Total Keys</div>
        <div class="value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Active</div>
        <div class="value" id="stat-active" style="color:var(--green);">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Paused</div>
        <div class="value" id="stat-paused" style="color:var(--yellow);">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Bound (HWID)</div>
        <div class="value" id="stat-bound" style="color:var(--accent);">—</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div id="toolbar">
      <input id="search-input" type="text" placeholder="Search keys, notes, HWID..." />
      <button class="btn btn-primary" id="create-btn">＋ New Key</button>
      <button class="btn btn-muted" id="refresh-btn">↻ Refresh</button>
    </div>

    <!-- Table -->
    <div id="keys-table-wrap">
      <table id="keys-table">
        <thead>
          <tr>
            <th>Key</th>
            <th>Note</th>
            <th>Status</th>
            <th>HWID</th>
            <th>Expires</th>
            <th>Last Seen</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="keys-tbody">
          <tr><td colspan="7" class="empty"><h3>Loading...</h3></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- ── Create Key Modal ──────────────────────────────────────────────────────── -->
<div class="modal-backdrop" id="create-modal">
  <div class="modal">
    <h2>Create New License Key</h2>
    <div class="field">
      <label>Note (customer name, order ID, etc.)</label>
      <input id="create-note" type="text" placeholder="e.g. John Doe – Gumroad #1234" />
    </div>
    <div class="field">
      <label>Expires in (days) — leave blank for unlimited</label>
      <input id="create-days" type="number" min="1" placeholder="e.g. 30, 365, blank = forever" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-muted" id="create-cancel-btn">Cancel</button>
      <button class="btn btn-primary" id="create-save-btn">Create Key</button>
    </div>
  </div>
</div>

<!-- ── Extend Modal ──────────────────────────────────────────────────────────── -->
<div class="modal-backdrop" id="extend-modal">
  <div class="modal">
    <h2>Extend License</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px;" id="extend-key-display"></p>
    <div class="field">
      <label>Days to add</label>
      <input id="extend-days" type="number" min="1" value="30" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-muted" id="extend-cancel-btn">Cancel</button>
      <button class="btn btn-primary" id="extend-save-btn">Add Days</button>
    </div>
  </div>
</div>

<!-- ── Log Modal ─────────────────────────────────────────────────────────────── -->
<div class="modal-backdrop" id="log-modal">
  <div class="modal" style="width:520px;">
    <h2>Audit Log</h2>
    <p style="color:var(--muted);font-size:12px;margin-bottom:14px;" id="log-key-display"></p>
    <div id="log-list"></div>
    <div class="modal-actions">
      <button class="btn btn-muted" id="log-close-btn">Close</button>
    </div>
  </div>
</div>

<!-- ── Toast Container ───────────────────────────────────────────────────────── -->
<div id="toast-container"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let ADMIN_SECRET = '';
let SERVER_URL   = '';
let allKeys      = [];
let extendTarget = null;
let logTarget    = null;

// ── Utils ──────────────────────────────────────────────────────────────────────
function fmt(ts) {
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function fmtExpiry(ts) {
  if (!ts) return '<span style="color:var(--muted)">Never</span>';
  const remaining = ts - Math.floor(Date.now() / 1000);
  const days = Math.ceil(remaining / 86400);
  const color = days < 7 ? 'var(--red)' : days < 30 ? 'var(--yellow)' : 'var(--green)';
  const label = remaining < 0 ? 'Expired' : days + 'd left';
  return `<span style="color:${color};font-weight:600;">${fmt(ts)}</span><br><span style="font-size:11px;color:${color};">${label}</span>`;
}
function badge(row) {
  const now = Math.floor(Date.now() / 1000);
  let status = row.status;
  if (status === 'active' && row.expires_at && row.expires_at < now) status = 'expired';
  const dot = `<span class="dot dot-${status}"></span>`;
  return `<span class="badge badge-${status}">${dot} ${status}</span>`;
}
function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard', 'info'));
}

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ── API ────────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const r = await fetch(SERVER_URL + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      'x-admin-secret': ADMIN_SECRET,
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}

// ── Render ─────────────────────────────────────────────────────────────────────
function applySearch() {
  const q = document.getElementById('search-input').value.toLowerCase();
  return allKeys.filter(k =>
    !q ||
    k.key.toLowerCase().includes(q) ||
    k.note.toLowerCase().includes(q) ||
    (k.hwid || '').toLowerCase().includes(q)
  );
}

function renderKeys() {
  const filtered = applySearch();
  const tbody = document.getElementById('keys-tbody');

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty"><h3>No keys found</h3><p>Create one to get started.</p></td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(row => {
    const actions = `
      <div class="actions">
        <button class="btn btn-sm btn-${row.status === 'paused' ? 'success' : 'warning'}" onclick="togglePause(${row.id})">
          ${row.status === 'paused' ? '▶ Resume' : '⏸ Pause'}
        </button>
        <button class="btn btn-sm btn-blue" onclick="openExtend(${row.id})">＋ Days</button>
        ${row.hwid ? `<button class="btn btn-sm btn-muted" onclick="unbindHwid(${row.id})">⛓ Unbind</button>` : ''}
        <button class="btn btn-sm btn-muted" onclick="openLog(${row.id})">📋 Log</button>
        <button class="btn btn-sm btn-danger" onclick="deleteKey(${row.id})">✕ Delete</button>
      </div>`;

    return `<tr>
      <td><span class="key-cell" title="Click to copy" onclick="copyText('${row.key}')">${row.key}</span></td>
      <td style="color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${row.note || ''}">${row.note || '<em>—</em>'}</td>
      <td>${badge(row)}</td>
      <td><span class="hwid-cell" title="${row.hwid || ''}">${row.hwid ? row.hwid.substring(0, 16) + '…' : '<span style="color:var(--muted)">Unbound</span>'}</span></td>
      <td style="font-size:12px;">${fmtExpiry(row.expires_at)}</td>
      <td style="font-size:12px;color:var(--muted);">${fmt(row.last_seen)}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('');
}

function updateStats() {
  const now = Math.floor(Date.now() / 1000);
  document.getElementById('stat-total').textContent  = allKeys.length;
  document.getElementById('stat-active').textContent = allKeys.filter(k => k.status === 'active' && (!k.expires_at || k.expires_at > now)).length;
  document.getElementById('stat-paused').textContent = allKeys.filter(k => k.status === 'paused').length;
  document.getElementById('stat-bound').textContent  = allKeys.filter(k => k.hwid).length;
}

async function loadKeys() {
  const data = await api('GET', '/admin/keys');
  if (!data.ok) { toast('Failed to load keys: ' + data.message, 'err'); return; }
  allKeys = data.keys;
  renderKeys();
  updateStats();
}

// ── Actions ────────────────────────────────────────────────────────────────────
async function togglePause(id) {
  const data = await api('POST', `/admin/keys/${id}/pause`);
  if (data.ok) { toast(`Key ${data.status}`, 'ok'); await loadKeys(); }
  else toast('Error: ' + data.message, 'err');
}

async function unbindHwid(id) {
  if (!confirm('Clear HWID binding? The key can be activated on a new machine.')) return;
  const data = await api('POST', `/admin/keys/${id}/unbind`);
  if (data.ok) { toast('HWID unbound', 'ok'); await loadKeys(); }
  else toast('Error: ' + data.message, 'err');
}

async function deleteKey(id) {
  const row = allKeys.find(k => k.id === id);
  if (!confirm(`Delete key ${row?.key}?\n\nThis will immediately revoke the key. The user's app will stop working on next validation check.`)) return;
  const data = await api('DELETE', `/admin/keys/${id}`);
  if (data.ok) { toast('Key deleted and revoked', 'ok'); await loadKeys(); }
  else toast('Error: ' + data.message, 'err');
}

function openExtend(id) {
  extendTarget = id;
  const row = allKeys.find(k => k.id === id);
  document.getElementById('extend-key-display').textContent = row ? row.key : '';
  document.getElementById('extend-days').value = '30';
  document.getElementById('extend-modal').classList.add('open');
}

async function saveExtend() {
  const days = parseInt(document.getElementById('extend-days').value, 10);
  if (!days || days < 1) { toast('Enter a valid number of days', 'err'); return; }
  const data = await api('POST', `/admin/keys/${extendTarget}/extend`, { days });
  if (data.ok) {
    toast(`Added ${days} days`, 'ok');
    document.getElementById('extend-modal').classList.remove('open');
    await loadKeys();
  } else toast('Error: ' + data.message, 'err');
}

async function openLog(id) {
  logTarget = id;
  const row = allKeys.find(k => k.id === id);
  document.getElementById('log-key-display').textContent = row ? row.key : '';
  document.getElementById('log-list').innerHTML = '<p style="color:var(--muted);font-size:12px;">Loading...</p>';
  document.getElementById('log-modal').classList.add('open');

  const data = await api('GET', `/admin/keys/${id}/log`);
  if (!data.ok) { document.getElementById('log-list').innerHTML = '<p style="color:var(--red)">Failed to load log</p>'; return; }

  if (data.log.length === 0) {
    document.getElementById('log-list').innerHTML = '<p style="color:var(--muted);font-size:12px;">No log entries yet.</p>';
    return;
  }

  document.getElementById('log-list').innerHTML = data.log.map(e => `
    <div class="log-entry">
      <span class="log-action">${e.action}</span>
      ${e.detail ? `<span class="log-detail"> · ${e.detail}</span>` : ''}
      <div class="log-time">${fmt(e.ts)}</div>
    </div>
  `).join('');
}

// ── Create Modal ───────────────────────────────────────────────────────────────
async function createKey() {
  const note = document.getElementById('create-note').value.trim();
  const days = document.getElementById('create-days').value;
  const data = await api('POST', '/admin/keys', { note, days: days ? parseInt(days, 10) : undefined });
  if (data.ok) {
    toast('Key created: ' + data.key.key, 'ok');
    document.getElementById('create-modal').classList.remove('open');
    document.getElementById('create-note').value = '';
    document.getElementById('create-days').value = '';
    await loadKeys();
  } else toast('Error: ' + data.message, 'err');
}

// ── Login ──────────────────────────────────────────────────────────────────────
async function attemptLogin() {
  const secret = document.getElementById('login-secret').value.trim();
  if (!secret) return;

  // Try to determine server URL — default to same origin
  const url = window.location.origin;
  SERVER_URL = url;
  ADMIN_SECRET = secret;

  try {
    const r = await fetch(url + '/admin/keys', {
      headers: { 'x-admin-secret': secret }
    });
    const data = await r.json();
    if (data.ok !== undefined && r.status !== 401) {
      // Success
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      document.getElementById('server-url-display').textContent = url;
      allKeys = data.keys;
      renderKeys();
      updateStats();
    } else {
      document.getElementById('login-error').textContent = 'Incorrect admin secret.';
    }
  } catch (e) {
    document.getElementById('login-error').textContent = 'Cannot reach server at ' + url;
  }
}

// ── Wire events ────────────────────────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', attemptLogin);
document.getElementById('login-secret').addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });

document.getElementById('logout-btn').addEventListener('click', () => {
  ADMIN_SECRET = ''; SERVER_URL = ''; allKeys = [];
  document.getElementById('login-screen').style.display = '';
  document.getElementById('app').classList.remove('visible');
  document.getElementById('login-secret').value = '';
  document.getElementById('login-error').textContent = '';
});

document.getElementById('create-btn').addEventListener('click', () => {
  document.getElementById('create-modal').classList.add('open');
});
document.getElementById('create-cancel-btn').addEventListener('click', () => {
  document.getElementById('create-modal').classList.remove('open');
});
document.getElementById('create-save-btn').addEventListener('click', createKey);

document.getElementById('extend-cancel-btn').addEventListener('click', () => {
  document.getElementById('extend-modal').classList.remove('open');
});
document.getElementById('extend-save-btn').addEventListener('click', saveExtend);

document.getElementById('log-close-btn').addEventListener('click', () => {
  document.getElementById('log-modal').classList.remove('open');
});

document.getElementById('refresh-btn').addEventListener('click', loadKeys);
document.getElementById('search-input').addEventListener('input', renderKeys);

// Close modals on backdrop click
['create-modal','extend-modal','log-modal'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
  });
});
</script>
