name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: electron:build
          - os: macos-latest
            script: electron:build:mac
          - os: ubuntu-latest
            script: electron:build:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only publish on real version tags, not manual runs without a tag
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-releases/

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          EOF

      - name: Upload release files to R2
        run: |
          # Upload all installer files and yml manifests
          find all-releases/ -type f \( \
            -name "*.exe" \
            -o -name "*.dmg" \
            -o -name "*.AppImage" \
            -o -name "*.yml" \
            -o -name "*.yaml" \
          \) | while read f; do
            fname=$(basename "$f")
            echo "Uploading $fname..."
            rclone copyto "$f" "r2:moodbot-releases/$fname" --s3-acl=public-read
          done
