<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#9333ea"/>
      <stop offset="50%"  stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Gradient border rounded rect -->
  <rect x="1" y="1" width="38" height="38" rx="10" ry="10"
        fill="url(#border-grad)"/>

  <!-- Dark inner background -->
  <rect x="3" y="3" width="34" height="34" rx="8" ry="8"
        fill="#030712"/>

  <!-- Bot icon (Lucide Bot, simplified) centered at 20,20 scaled to ~22px -->
  <!-- Head -->
  <rect x="10" y="13" width="20" height="14" rx="3" ry="3"
        fill="none" stroke="url(#icon-grad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Antenna base -->
  <line x1="20" y1="13" x2="20" y2="9"
        stroke="url(#icon-grad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Antenna top dot -->
  <circle cx="20" cy="8" r="1.5" fill="#c084fc"/>
  <!-- Left eye -->
  <rect x="13.5" y="17.5" width="3" height="3" rx="0.75" ry="0.75" fill="#c084fc"/>
  <!-- Right eye -->
  <rect x="23.5" y="17.5" width="3" height="3" rx="0.75" ry="0.75" fill="#c084fc"/>
  <!-- Mouth -->
  <line x1="15" y1="23" x2="25" y2="23"
        stroke="#c084fc" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Left ear -->
  <line x1="10" y1="18" x2="8"  y2="18"
        stroke="url(#icon-grad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Right ear -->
  <line x1="30" y1="18" x2="32" y2="18"
        stroke="url(#icon-grad)" stroke-width="2" stroke-linecap="round"/>
</svg>
